spring.application.name=hospital-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospitaldb}
spring.datasource.username=${DB_USERNAME:hospital_user}
spring.datasource.password=${DB_PASSWORD}
server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8888/eureka/

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_history
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true



