spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.server.webflux.routes[0].id=hospital-notification-service
spring.cloud.gateway.server.webflux.routes[0].order=0
spring.cloud.gateway.server.webflux.routes[0].uri=lb://HOSPITAL-NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/notifications,/notifications/**

spring.cloud.gateway.server.webflux.routes[1].id=hospital-system
spring.cloud.gateway.server.webflux.routes[1].order=100
spring.cloud.gateway.server.webflux.routes[1].uri=lb://HOSPITAL-SYSTEM
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/**

eureka.client.service-url.defaultZone=http://localhost:8888/eureka/

eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,gateway
