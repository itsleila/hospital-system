apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: hospital

spec:
  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: hospital-system-api-gateway:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: HOSPITAL_DB_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: HOSPITAL_DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: HOSPITAL_DB_PASSWORD

            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: RABBITMQ_HOST

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: RABBITMQ_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: RABBITMQ_PASSWORD

            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: EUREKA_URL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 15

---

apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: hospital

spec:
  selector:
    app: api-gateway

  ports:
    - port: 8080
      targetPort: 8080