apiVersion: apps/v1
kind: Deployment

metadata:
  name: hospital-notification-service
  namespace: hospital

spec:
  selector:
    matchLabels:
      app: hospital-notification-service

  template:
    metadata:
      labels:
        app: hospital-notification-service

    spec:
      containers:
        - name: hospital-notification-service
          image: hospital-system-hospital-notification-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8082

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: HOSPITAL_DB_URL

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: HOSPITAL_DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: HOSPITAL_DB_PASSWORD

            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: RABBITMQ_HOST

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: RABBITMQ_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: RABBITMQ_PASSWORD

            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: EUREKA_URL

            - name: OTEL_ENDPOINT
              value: http://tempo:4318/v1/traces
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082

            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082

            initialDelaySeconds: 30
            periodSeconds: 15

---

apiVersion: v1
kind: Service

metadata:
  name: hospital-notification-service
  namespace: hospital

spec:
  selector:
    app: hospital-notification-service

  ports:
    - port: 8082
      targetPort: 8082