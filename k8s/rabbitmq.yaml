apiVersion: v1
kind: Service

metadata:
  name: rabbitmq-headless
  namespace: hospital

spec:
  clusterIP: None

  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

---

apiVersion: v1
kind: Service

metadata:
  name: rabbitmq
  namespace: hospital

spec:
  type: ClusterIP

  selector:
    app: rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

---

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: rabbitmq
  namespace: hospital

spec:
  serviceName: rabbitmq-headless
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
        - name: rabbitmq

          image: rabbitmq:4-management

          ports:
            - containerPort: 5672
              name: amqp

            - containerPort: 15672
              name: management

          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: RABBITMQ_USER

            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: RABBITMQ_PASSWORD

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_running

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi