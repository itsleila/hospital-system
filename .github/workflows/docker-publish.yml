name: Docker Publish

on:

  workflow_run:
    workflows:
      - CI

    types:
      - completed

  workflow_dispatch:

jobs:

  publish:

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:

      matrix:

        include:

          - service: hospital-system-api
            image: hospital-system-api

          - service: hospital-notification-service
            image: hospital-notification-service

          - service: api-gateway
            image: api-gateway

          - service: discovery-server
            image: discovery-server

          - service: hospital-system-web
            image: hospital-system-web

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get lowercase GitHub owner
        id: owner

        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6

        with:
          context: ./${{ matrix.service }}

          push: true

          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}