name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  backend:
    name: Test ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - hospital-system-api
          - hospital-notification-service
          - api-gateway
          - discovery-server

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '21'

          cache: maven

          cache-dependency-path: |
            ${{ matrix.service }}/pom.xml

      - name: Compile and test
        working-directory: ${{ matrix.service }}

        run: mvn --batch-mode clean verify


  frontend:

    name: Test Frontend

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7

        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hospital-system-web/package-lock.json

      - name: Install dependencies
        working-directory: hospital-system-web

        run: npm ci

      - name: Run tests
        working-directory: hospital-system-web

        run: npm run test --if-present

      - name: Build frontend
        working-directory: hospital-system-web

        run: npm run build